<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <title>BXGY Bundle Widget</title>
</head>
<body class="min-h-screen bg-[#ecebe8] text-neutral-900 antialiased">

    <!-- ================================================================
         DEV PREVIEW BAR — chỉ dùng để test, không thuộc widget
         ================================================================ -->
    <div class="sticky top-0 z-50 border-b border-black/10 bg-white/90 text-sm backdrop-blur" data-dev-toolbar>
        <!-- Hàng 1: chọn offer (case) + trạng thái bắt đầu -->
        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 px-4 py-2.5">
            <div class="dev-field">
                <label for="dev-offer" class="dev-label">Offer</label>
                <select id="dev-offer" class="dev-select" data-dev-offer></select>
            </div>
            <div class="dev-field">
                <span class="dev-label">Start</span>
                <div class="dev-seg" role="radiogroup" aria-label="Start state" data-dev-opt="start">
                    <button type="button" data-value="empty">Empty</button>
                    <button type="button" data-value="almost">Almost</button>
                    <button type="button" data-value="unlocked">Unlocked</button>
                </div>
            </div>
            <div class="dev-field">
                <span class="dev-label">Sold out item</span>
                <div class="dev-seg" role="radiogroup" aria-label="Preview sold out item" data-dev-opt="soldOut">
                    <button type="button" data-value="off">Off</button>
                    <button type="button" data-value="on">On</button>
                </div>
            </div>
            <button type="button" class="dev-preset" data-dev-reset title="Đưa selection về trạng thái Start">↺ Reset</button>
        </div>
        <!-- Hàng 2: width -->
        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 border-t border-black/5 px-4 py-2">
            <p class="text-xs text-neutral-500" data-dev-offer-info></p>
            <div class="dev-field ml-auto">
                <label for="dev-width" class="dev-label">Width</label>
                <input id="dev-width" type="range" min="320" max="1920" step="1" value="560" class="w-28 accent-neutral-900" data-dev-width-range>
                <input type="number" min="320" max="1920" value="560"
                       class="w-16 rounded-md border border-neutral-300 px-1.5 py-0.5 text-right tabular-nums"
                       aria-label="Section width in pixels" data-dev-width-input>
                <span class="text-neutral-500">px</span>
            </div>
            <div class="flex flex-wrap gap-1" data-dev-presets>
                <button type="button" class="dev-preset" data-width="375">375</button>
                <button type="button" class="dev-preset" data-width="560">560</button>
                <button type="button" class="dev-preset" data-width="1024">1024</button>
            </div>
        </div>
    </div>

    <!-- SVG icon sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden">
        <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M6 12h12"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
        <symbol id="i-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
        <symbol id="i-tee" viewBox="0 0 64 64"><path fill="currentColor" d="M23 8c1.5 4 5 6.5 9 6.5S39.5 12 41 8l12 5 7 13-9 4-3-5v31H16V25l-3 5-9-4 7-13z"/></symbol>
        <symbol id="i-cap" viewBox="0 0 64 64"><path fill="currentColor" d="M10 38c0-13 9.5-23 22-23s22 10 22 23v2H10z"/><path fill="currentColor" opacity=".75" d="M8 40h40c6 0 10 2 10 5H8z"/><circle cx="32" cy="14" r="2.5" fill="currentColor"/></symbol>
    </svg>

    <!-- Stage -->
    <div class="overflow-x-auto px-4 py-10">
        <div class="dev-frame mx-auto" style="width: 560px" data-dev-frame>
            <p class="mb-2 font-mono text-xs text-neutral-500" data-dev-frame-label>560px</p>

            <!-- ================================================================
                 BXGY BUNDLE WIDGET — theme app block
                 Nội dung render từ data (script.js), theo trigger/reward type.
                 ================================================================ -->
            <section class="bxgy-widget" data-bxgy-widget aria-labelledby="bxgy-title">
                <div class="bxgy-layout" data-bxgy-root></div>

                <!-- Variant sheet: bottom sheet (mobile) / modal (desktop) -->
                <dialog class="bxgy-sheet" data-bxgy-sheet aria-labelledby="bxgy-sheet-title">
                    <div class="bxgy-sheet-inner" data-bxgy-sheet-body></div>
                </dialog>
            </section>
        </div>
    </div>

    <script src="mock-data.js"></script>
    <script src="script.js"></script>
    <script src="dev-toolbar.js"></script>
</body>
</html>
